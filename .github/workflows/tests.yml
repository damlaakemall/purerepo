name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke test (synthetic benchmark, CPU)
        run: llmr train configs/experiments/quality_regression__synthetic.yaml output_dir=/tmp/runs benchmark.path=/tmp/bench

      - name: shared collection smoke (test doubles, no training or model downloads)
        run: llmr smoke-pipeline --output /tmp/shared-smoke
