# The routing pool: the 9 open-weight models of SU Lab LLM-Routing-Project, run on Tosun GPUs.
# No paid APIs: the reference repo's three API models (kimi-k3, glm-5.3, gpt-5.4) are left out.
# Keep names fixed once a release has results. Revisions are the HF commits pinned on 2026-10-15.
#
# cost_per_1k_tokens is the token proxy (cost.definition: token_proxy): ACTIVE parameters in billions,
# i.e. compute per token. It is not USD. DECISIONS.md #2 tracks whether to switch to measured GPU
# time; every response also records its share of batch wall-clock time (metadata.batch_seconds_per_sample).
#
# gpus: GPUs per generation job. A 27B model in bf16 needs ~56 GB of weights plus KV cache: one 80 GB
# card, or gpus: 2 (vLLM tensor parallelism is set from it). Check `sinfo -o "%N %G"` on Tosun.
# chat_template_kwargs: thinking switched off where the template supports it (as in the reference);
# DeepSeek-R1-Distill always reasons, and its <think> block is stripped before scoring.
models:
  - name: qwen3-4b
    model_id: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
    chat_template_kwargs: {enable_thinking: false}
    cost_per_1k_tokens: 4.0
  - name: gemma-4-e2b
    model_id: google/gemma-4-E2B-it
    revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
    chat_template_kwargs: {enable_thinking: false}
    cost_per_1k_tokens: 2.0      # "effective 2B"; per-layer embeddings are lookups, not compute
