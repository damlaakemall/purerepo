# The routing pool: 12 open-weight models run on Tosun GPUs, no paid APIs.
# Deliberately disjoint from SU Lab LLM-Routing-Project's 12 (Qwen3, Gemma 4, Cogito, R1-Distill-Qwen,
# Granite 4.1, Qwen3.6, Kimi, GLM, GPT): same prompts and protocol, different models.
# Sizes span 3B -> 33B so that routing has a real cost/quality spread: 3 small, 5 mid, 4 large.
# Keep names fixed once a release has results. Revisions are the HF commits pinned on 2026-10-15.
#
# Gated: the Llama and Gemma repos need each member to accept the license on huggingface.co with the
# account whose token Tosun uses (`hf auth login`), otherwise the download fails with 403.
#
# cost_per_1k_tokens is the token proxy (cost.definition: token_proxy): parameters in billions
# (every model here is dense), i.e. compute per token. It is not USD. DECISIONS.md #2 tracks whether
# to switch to measured GPU time; every response records metadata.batch_seconds_per_sample.
#
# gpus: GPUs per generation job (vLLM tensor parallelism is set from it). bf16 weights take ~2 GB
# per billion parameters plus KV cache: 24B+ models get 2 GPUs, phi-4 (15B) needs a >= 40 GB card.
# Check `sinfo -p cuda -o "%N %G"` on Tosun and lower gpus to 1 on 80 GB cards.
# engine_kwargs.max_model_len caps the KV cache: prompts are at most ~3k tokens (Multi-News) plus
# max_new_tokens 4096; without the cap vLLM reserves memory for each model's full 32k-128k context.
# chat_template_kwargs: SmolLM3 thinks by default and is switched off; DeepSeek-R1-Distill always
# reasons, and its <think> block is stripped before scoring.
models:
  # ---- small (3-4B) ----
  - name: smollm3-3b
    model_id: HuggingFaceTB/SmolLM3-3B
    revision: a07cc9a04f16550a088caea529712d1d335b0ac1
    chat_template_kwargs: {enable_thinking: false}
    engine_kwargs: {max_model_len: 16384}
    cost_per_1k_tokens: 3.1
  - name: llama-3.2-3b
    model_id: meta-llama/Llama-3.2-3B-Instruct      # gated
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
