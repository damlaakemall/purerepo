# shared_v2: 12 dense open-weight models; v1's pool stays unchanged.
# Falcon3-7B-Instruct (7.4556B) replaces the 8.0303B R1 distill model to remove
# its dedicated long-reasoning regime. Similar size does not mean equal quality.
# Other revisions are retained from v1; Falcon's revision was checked on 2026-10-19.
# SmolLM3 thinking remains disabled. All samples use the benchmark's common budget.
# cost_per_1k_tokens = rounded parameters (B), a token proxy, never USD.
# Llama and Gemma still need license acceptance by their assigned collector.
# Large models request one 96 GB RTX PRO 6000 for generation; this is a placement
# choice from Tosun's 2026-10-19 inventory, pending real v2 memory/throughput pilots.
# LLMR_GPU_TYPE overrides gpu_type (actual alternatives: a100_80gb, h200_nvl).
# Scorers keep their own 1-GPU requests; gpu_type here applies only to generation.
# Total prompt + completion context is capped at 16384, including for Phi-4.
models:
  # ---- small (3-4B) ----
  - name: smollm3-3b
    model_id: HuggingFaceTB/SmolLM3-3B
    revision: a07cc9a04f16550a088caea529712d1d335b0ac1
    chat_template_kwargs: {enable_thinking: false}
    engine_kwargs: {max_model_len: 16384}
    cost_per_1k_tokens: 3.1
